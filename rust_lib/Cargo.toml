[package]
name = "rust_lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ureq = { version = "3.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
serde_json = "1"
