[tools]
rust = "1.98.1"
cmake = "4.4.3"
ninja = "1.13.2"

# Load FINNHUB_API_KEY (and anything else) from a local, untracked .env file.
[env]
_.file = ".env"

[tasks.setup]
description = "Install native dependencies for macOS or Debian/Ubuntu"
run = '''
case "$(uname -s)" in
  Darwin)
    command -v brew >/dev/null 2>&1 || {
      echo "Homebrew is required: https://brew.sh"
      exit 1
    }
    brew install sdl2
    ;;
  Linux)
    command -v apt-get >/dev/null 2>&1 || {
      echo "Only Debian/Ubuntu Linux is supported"
      exit 1
    }
    sudo apt-get update
    sudo apt-get install -y libsdl2-dev
    ;;
  *)
    echo "Unsupported operating system: $(uname -s)"
    exit 1
    ;;
esac
'''

[tasks.configure]
description = "Configure the CMake build"
run = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"

[tasks."build:rust"]
description = "Build the rust_lib crate"
dir = "rust_lib"
run = '''
if [ "$(uname -s)" = Darwin ]; then
  MACOSX_DEPLOYMENT_TARGET=26.0 cargo build --release
else
  cargo build --release
fi
'''

[tasks.build]
description = "Build rust_lib and the C++/ImGui app"
depends = ["configure", "build:rust"]
run = "cmake --build build"

[tasks.run]
description = "Run the ImGui stock price app"
depends = ["build"]
run = "./build/cpp_app/cpp_app"

[tasks."test:rust"]
description = "Run the rust_lib test suite"
dir = "rust_lib"
run = "cargo test"

[tasks."test:rust:live"]
description = "Run the rust_lib tests including the live Finnhub call (needs FINNHUB_API_KEY)"
dir = "rust_lib"
run = "cargo test -- --ignored"

[tasks.test]
description = "Run all tests"
depends = ["test:rust"]

[tasks.lint]
description = "Format and lint the Rust crate"
dir = "rust_lib"
run = "cargo fmt --check && cargo clippy --all-targets"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf build rust_lib/rust_lib_cpp/include && (cd rust_lib && cargo clean)"

# rust_lib exposes a cxx.rs bridge; CMake drives `cargo build --release` and
# publishes the generated headers into rust_lib/rust_lib_cpp/include.
